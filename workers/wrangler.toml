name = "osrs-hiscores-clone"
main = "src/index.js"
compatibility_date = "2026-10-10"

[assets]
directory = "../frontend"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

# Set ADMIN_TOKEN using `npx wrangler secret put ADMIN_TOKEN`.

[[durable_objects.bindings]]
name = "HISCORES_WORLD"
class_name = "HiscoresWorld"

[[migrations]]
tag = "v1-world-sqlite"
new_sqlite_classes = ["HiscoresWorld"]
