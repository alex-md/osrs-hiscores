name = "osrs-hiscores-clone"
main = "src/index.js"
compatibility_date = "2026-10-10"

[assets]
directory = "../frontend"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

# Set ADMIN_TOKEN using `npx wrangler secret put ADMIN_TOKEN`.

[[durable_objects.bindings]]
name = "HISCORES_WORLD"
class_name = "HiscoresWorld"

[[migrations]]
tag = "v1-world-sqlite"
new_sqlite_classes = ["HiscoresWorld"]

# The release pipeline verifies this named database and applies migrations before deploying.
[[d1_databases]]
binding = "HISTORY_DB"
database_name = "osrs-hiscores-history"
database_id = "3c1244c3-667f-41ae-8530-4f6732601eef"
migrations_dir = "migrations"

# Optional observational telemetry; removing this binding disables emission.
# Cloudflare creates the dataset on the first write. No SQL API token is needed
# by the simulation; querying it separately requires Account Analytics Read.
[[analytics_engine_datasets]]
binding = "EXCHANGE_ANALYTICS"
dataset = "osrs_exchange"
