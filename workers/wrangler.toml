name = "osrs-hiscores-clone"
main = "src/index.js"
compatibility_date = "2026-10-10"

[assets]
directory = "../frontend"
binding = "ASSETS"
run_worker_first = ["/api", "/api/*"]

[observability]
enabled = true

[triggers]
crons = ["0 */4 * * *"]

[[kv_namespaces]]
binding = "HISCORES_KV"
id = "884ba8e6b3484b0eb148b1e847c7a29a"

# Set ADMIN_TOKEN using `npx wrangler secret put ADMIN_TOKEN`.
