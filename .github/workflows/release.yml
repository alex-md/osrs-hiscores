name: Verify and deploy application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci --prefix workers
      - run: npm test
      - run: npm run check
      - run: npm run capacity
      - name: Verify Pages Functions with the hosted build version
        run: npx --yes wrangler@3.114.17 pages functions build functions --outfile /tmp/pages-worker.mjs
      - run: npm exec -- wrangler deploy --dry-run
        working-directory: workers
  deploy-worker:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository Actions secrets or the cloudflare environment. See README.md (Automatic releases)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci --prefix workers
      - name: Deploy Worker, assets, Durable Object binding and cron
        run: npm --prefix workers run deploy -- --var "RELEASE_SHA:$RELEASE_SHA"
      - name: Verify deployed commit and Durable Object health
        run: node scripts/verify-release.mjs worker
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare frontend with the same Worker connection and release commit
        run: node scripts/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published frontend commit and API connection
        run: node scripts/verify-release.mjs pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
